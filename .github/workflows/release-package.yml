name: Build, test and publish an independent package

on:
  push:
    tags: ['requirements-shared-kernel/v*']

permissions:
  contents: read

defaults:
  run:
    # The runner formats {0}; escape literal PowerShell braces as {{ and }}.
    shell: >-
      pwsh -NoLogo -NoProfile -Command "$ErrorActionPreference = 'Stop';
      if ($PSVersionTable.PSVersion -lt [version]'7.6') {{ throw 'PowerShell 7.6+ is required.' }};
      $utf8 = [System.Text.UTF8Encoding]::new($false);
      [Console]::InputEncoding = $utf8; [Console]::OutputEncoding = $utf8; $OutputEncoding = $utf8;
      $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test release tooling
        working-directory: ${{ github.workspace }}
        run: node --test test/release.test.mjs
      - name: Stage only the selected independent package
        working-directory: ${{ github.workspace }}
        run: node scripts/release.mjs stage "$env:GITHUB_REF_NAME" "$env:RUNNER_TEMP/isolated-release"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ${{ runner.temp }}/isolated-release/package.json
          run_install: false
      - name: Require the committed isolated lockfile
        working-directory: ${{ runner.temp }}/isolated-release
        run: |
          if (!(Test-Path -LiteralPath pnpm-lock.yaml)) { throw 'Prepare and commit release/requirements-shared-kernel/pnpm-lock.yaml before tagging.' }
      - name: Install committed dependencies
        working-directory: ${{ runner.temp }}/isolated-release
        run: pnpm install --frozen-lockfile
      - name: Build selected package
        working-directory: ${{ runner.temp }}/isolated-release
        run: pnpm run build
      - name: Test selected package
        working-directory: ${{ runner.temp }}/isolated-release
        run: pnpm run test:ci

  publish:
    permissions:
      contents: read
      id-token: write
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: npm-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Stage the verified package and choose npm channel
        id: release
        working-directory: ${{ github.workspace }}
        run: node scripts/release.mjs stage "$env:GITHUB_REF_NAME" "$env:RUNNER_TEMP/isolated-release"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ${{ runner.temp }}/isolated-release/package.json
          run_install: false
      - name: Install committed dependencies
        working-directory: ${{ runner.temp }}/isolated-release
        run: pnpm install --frozen-lockfile
      - name: Build selected package
        working-directory: ${{ runner.temp }}/isolated-release
        run: pnpm run build
      - name: Configure npm authentication
        uses: actions/setup-node@v6
        with:
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Publish selected package
        working-directory: ${{ runner.temp }}/isolated-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.release.outputs.dist-tag }}
        run: |
          pnpm -r publish --access public --registry https://registry.npmjs.org/ --tag "$env:DIST_TAG" --no-git-checks --ignore-scripts
