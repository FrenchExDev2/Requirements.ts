# Dependency installations must select their profile explicitly.
verifyDepsBeforeRun: false
linkWorkspacePackages: deep
packages:
  - packages/*
  - ../Requirements.SharedKernel.ts/packages/*
includeWorkspaceRoot: false
catalog:
  '@clack/prompts': ^1.8.1
  '@stryker-mutator/core': ^10.1.1
  '@stryker-mutator/typescript-checker': ^10.1.1
  '@stryker-mutator/vitest-runner': ^10.1.1
  '@types/node': ^26.6.6
  '@vitest/coverage-v8': 5.0.5
  ajv: ^8.20.0
  chokidar: ^6.0.0
  commander: ^15.0.0
  diff: ^9.0.0
  fast-check: ^4.10.2
  picocolors: ^1.1.1
  ts-json-schema-generator: ^2.9.0
  ts-morph: ^28.0.0
  tsx: 4.23.15
  '@typescript/native': 'npm:typescript@^7.0.2'
  typescript: 'npm:@typescript/typescript6@^6.0.2'
  vitest: 5.0.5
catalogs:
  peer:
    typescript: '>=5.4 <7'
allowBuilds:
  esbuild: true
# Security overrides are qualified by the build, schema, unit and mutation runs.
overrides:
  qs@6: 6.16.1
  vite@8: 8.1.6
  nanoid@3: 3.3.18
  undici@8: 8.12.2
  glob@13: 14.0.2
  minimatch@10: 11.0.1

